<!DOCTYPE html>

<html lang="en">
	<head>

		<!-- Metadata -->
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">

		<!-- Title + Favicon -->
		<title>SM737.Site</title>
		<link rel="icon" type="image/x-icon" href="../images/favicon.ico">

		<!-- CSS -->
		<link rel="stylesheet" href="../css/styles.css">
		<link rel="stylesheet" href="../css/game_pages.css">


	</head>

	<body>

		<header>
			<iframe src="../header.html" width="100%" height="55px" frameborder="0" scrolling="no" alt="header"></iframe>
		</header>

		<main>
			
			<div class="game_box fade_in">
           		<!-- Game Iframe -->
				<iframe class="game_iframe" id="game" src="https://html-classic.itch.zone/html/17602439/index.html" frameborder="0" scrolling="no"></iframe>

				<!--  Title And Buttons  -->
				<div class="title_buttons" id="title_buttons">
					<p class="title">Mini Volleyball</p>
					<button onclick="toggleFullScreen()" class="button"> <img src="../images/buttons/fullscreen.svg" class="button_image"></img> </button>
					<button onclick="toggleDescription()" class="button"> <img src="../images/buttons/description_on.svg" class="button_image" id="description_toggle_image"></img> </button>
				</div>

				<!--  Description  -->
				<div class="description" id="description">
					<p>A small volleyball party game I made. This is my first project using <a class="link" href="https://godotengine.org/" target="_blank">Godot</a> and I'm really happy with how it turned out.</p>
					<p>Music - <a class="link" href="https://opengameart.org/content/somewhere-in-the-elevator" target="_blank">Somewhere in the Elevator</a> by Peachtea (<a class="link" target="_blank" href="https://opengameart.org/users/youre-perfect-studio">@You're Perfect Studio</a>)</p>
					<p class="text-center"><br></p>
				</div>
			</div>

		</main>

		<footer>
			<iframe src="../footer.html" width="100%" height="35px" frameborder="0" scrolling="no" alt="footer"></iframe>
		</footer>

		<script src="../scripts/fade_in.js"></script>
		<script src="../scripts/game_iframe.js"></script>

	</body>
</html>
